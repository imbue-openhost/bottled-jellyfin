[app]
name = "jellyfin"
version = "0.1.0"
description = "Jellyfin (open-source media server) packaged for OpenHost.  The OpenHost zone owner is auto-signed-in to Jellyfin's web UI without ever seeing the password form; an HTML shim seeds Jellyfin's localStorage 'jellyfin_credentials' entry with a server-minted access token before bouncing to /web/."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# auth-proxy port.  Jellyfin runs on 127.0.0.1:8096 inside the
# container; the proxy listens on 8080 and is what the OpenHost
# router forwards to.
port = 8080

[routing]
# Static /_healthz served by the auth-proxy returns 200 as soon
# as the proxy is up, which is well before Jellyfin's own
# /System/Info/Public is reachable.  Jellyfin's first-boot
# initialisation (DB schema migration, plugin scan, etc.) can
# take 60+s; this avoids OpenHost flagging the app as failed
# during that window.
health_check = "/_healthz"
# Public paths Jellyfin needs:
#   * /System/                   — public server info, queried by
#                                   third-party Jellyfin clients
#                                   for discovery without auth.
#   * /Users/AuthenticateByName  — login API (called by mobile /
#                                   desktop clients with their own
#                                   credentials)
#   * /Users/Public              — list of public users for client
#                                   pickers.
#   * /web/                      — the SPA assets.  Reachable
#                                   without zone_auth so that
#                                   shared-link playback etc.
#                                   works for non-owner viewers.
#   * /Items/                    — direct-stream media URLs that
#                                   carry their own ?api_key=...
#   * /videos/, /Audio/, /Video/ — same.
#   * /api-docs/, /openapi*      — Jellyfin's public OpenAPI surface.
#   * /socket                    — Jellyfin's WebSocket endpoint.
public_paths = [
    "/_healthz",
    "/System/",
    "/Users/AuthenticateByName",
    "/Users/Public",
    "/Users/ForgotPassword",
    "/web/",
    "/Items/",
    "/videos/",
    "/Audio/",
    "/Video/",
    "/api-docs/",
    "/openapi",
    "/socket",
    "/QuickConnect/",
]

[resources]
# Jellyfin is comparatively heavyweight: .NET runtime + ffmpeg
# (transcoding) + media indexing.  1 GiB is comfortable for
# small libraries; bump higher if you index large collections
# or transcode 4K.
memory_mb = 1536
cpu_millicores = 1500

[data]
# Persistent state under /data/app_data/jellyfin/ (local NVMe,
# backed up — small, fast, POSIX-strict; safe for SQLite):
#   * config/    — Jellyfin server config (network.xml, system.xml,
#                  encoding.xml, etc.)
#   * data/      — media DB, user DB, plugin metadata (SQLite —
#                  MUST stay on app_data, never on the archive FS)
#   * cache/     — transcode cache + thumbnail cache
#   * log/       — Jellyfin's logs
#   * admin-token.json — bootstrap-generated server id + admin
#                  user id + access token (mode 0600)
app_data = true
app_temp_data = true
# Bulk media (the actual video/audio files) lives under
# /data/app_archive/jellyfin/media/ instead of app_data so it
# doesn't fill the host's local disk.  The archive tier is always
# available (local-disk JuiceFS by default) and transparently
# offloads to S3 once the operator upgrades the zone from the
# dashboard.  SQLite DBs deliberately stay on app_data above.
app_archive = true
